<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rutas Barralaga - Sistema Operativo de Despacho</title>
    <link href="https://api.mapbox.com/mapbox-gl-js/v2.14.1/mapbox-gl.css" rel="stylesheet">
    <style>
        * { box-sizing: border-box; font-family: system-ui, -apple-system, sans-serif; }
        body { margin: 0; padding: 0; background: #f4f4f9; display: flex; height: 100vh; overflow: hidden; }
        
        /* Panel izquierdo: Gestión y Lista */
        .panel-control {
            width: 420px; height: 100vh; background: #fff; box-shadow: 4px 0 15px rgba(0,0,0,0.1);
            display: flex; flex-direction: column; z-index: 10;
        }
        .header-panel { padding: 20px; background: #111; color: #fff; }
        .header-panel h2 { margin: 0; font-size: 18px; }
        .header-panel p { margin: 4px 0 0 0; font-size: 12px; color: #aaa; }

        .acciones-superiores { padding: 15px; background: #fafafa; border-bottom: 1px solid #e5e7eb; display: flex; gap: 8px; }
        .btn-principal {
            background: #111; color: #fff; border: none; padding: 10px 14px;
            border-radius: 8px; font-weight: bold; cursor: pointer; font-size: 13px; flex: 1;
        }
        .btn-principal:hover { background: #333; }
        
        .lista-pedidos { flex: 1; overflow-y: auto; padding: 15px; display: flex; flex-direction: column; gap: 10px; }
        
        .tarjeta-pedido {
            border: 1px solid #e5e7eb; border-radius: 10px; padding: 12px; background: #fafafa;
            display: flex; flex-direction: column; gap: 6px;
        }
        .tarjeta-pedido.completado { background: #f0fdf4; border-color: #86efac; opacity: 0.7; }
        
        .info-superior { display: flex; justify-content: space-between; align-items: flex-start; }
        .badge-servicio { background: #2563eb; color: #fff; font-size: 11px; padding: 2px 6px; border-radius: 4px; font-weight: bold; }
        .badge-numero { background: #111; color: #fff; font-weight: bold; padding: 2px 6px; border-radius: 4px; font-size: 11px; }
        
        .cliente-nombre { font-weight: bold; font-size: 14px; color: #111; margin: 4px 0 0 0; }
        .cliente-dir { font-size: 12px; color: #555; margin: 2px 0 0 0; }
        
        .botones-accion { display: flex; gap: 6px; margin-top: 6px; }
        .btn { flex: 1; padding: 7px; border: none; border-radius: 6px; font-size: 11px; font-weight: bold; cursor: pointer; text-align: center; }
        .btn-wa { background: #25D366; color: #fff; }
        .btn-ok { background: #16a34a; color: #fff; }
        .btn-map { background: #e5e7eb; color: #111; }

        /* Panel derecho: Mapa */
        #map { flex: 1; height: 100vh; }

        /* Modal Nuevo Servicio */
        #modal-servicio {
            display: none; position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            background: rgba(0,0,0,0.6); z-index: 20; align-items: center; justify-content: center;
        }
        .modal-contenido { background: white; padding: 20px; border-radius: 14px; width: 90%; max-width: 360px; }
        .input-form { width: 100%; padding: 10px; margin-bottom: 10px; border: 1px solid #ccc; border-radius: 8px; font-size: 13px; }
        .select-form { width: 100%; padding: 10px; margin-bottom: 10px; border: 1px solid #ccc; border-radius: 8px; font-size: 13px; background: white; }

        @media (max-width: 768px) {
            body { flex-direction: column; overflow: auto; }
            .panel-control { width: 100vw; height: 50vh; }
            #map { width: 100vw; height: 50vh; }
        }
    </style>
</head>
<body>

    <!-- Panel Izquierdo -->
    <div class="panel-control">
        <div class="header-panel">
            <h2>🚚 Rutas Barralaga</h2>
            <p>Logística y Distribución - Zmax 200</p>
        </div>
        
        <div class="acciones-superiores">
            <button class="btn-principal" onclick="abrirModal()">+ Registrar Servicio</button>
        </div>

        <div class="lista-pedidos" id="contenedor-lista"></div>
    </div>

    <!-- Mapa Maestro -->
    <div id="map"></div>

    <!-- Modal para Agregar Servicio -->
    <div id="modal-servicio">
        <div class="modal-contenido">
            <h3 style="margin-top: 0; font-size: 16px;">Nuevo Servicio / Entrega</h3>
            <select id="tipo-servicio" class="select-form">
                <option value="Entregas Express">01. Entregas Express</option>
                <option value="Encomiendas">02. Encomiendas y Paquetería</option>
                <option value="Multidrop">03. Distribución Multidestino</option>
                <option value="Dedicada">05. Rutas Empresariales Dedicadas</option>
                <option value="Agente Local">06. Agente Local en Honduras</option>
            </select>
            <input type="text" id="nombre-cliente" class="input-form" placeholder="Nombre del cliente o comercio">
            <input type="tel" id="tel-cliente" class="input-form" placeholder="Teléfono / WhatsApp (Ej. 50499999999)">
            <input type="text" id="dir-cliente" class="input-form" placeholder="Colonia, Barrio o referencia exacta en SPS">
            
            <button onclick="guardarServicio()" class="btn-principal" style="width: 100%; padding: 11px;">Guardar en Ruta</button>
            <button onclick="cerrarModal()" style="width: 100%; padding: 8px; margin-top: 5px; background: none; border: none; color: #666; cursor: pointer;">Cancelar</button>
        </div>
    </div>

    <script src="https://api.mapbox.com/mapbox-gl-js/v2.14.1/mapbox-gl.js"></script>
    <script>
        mapboxgl.accessToken = 'pk.eyJ1Ijoiam9oYW5qYmFycmFsYWdhLXNvdXJjZSIsImEiOiJjbXc1MzZydDYwM3UwMnlvcDMwOXMyMWxrIn0.gWzeC9I8V_c6uRxnRIMIrg';
        const BASE_SPS = [-88.0250, 15.5042];

        // Memoria local del teléfono/navegador
        let servicios = JSON.parse(localStorage.getItem('rutas_barralaga_operacion') || '[]');
        let marcadores = [];

        const map = new mapboxgl.Map({
            container: 'map',
            style: 'mapbox://styles/mapbox/streets-v12',
            center: BASE_SPS,
            zoom: 13
        });
        map.addControl(new mapboxgl.NavigationControl(), 'bottom-right');

        map.on('load', () => {
            renderizarOperacion();
        });

        function abrirModal() { document.getElementById('modal-servicio').style.display = 'flex'; }
        function cerrarModal() { document.getElementById('modal-servicio').style.display = 'none'; }

        async function guardarServicio() {
            const servicio = document.getElementById('tipo-servicio').value;
            const cliente = document.getElementById('nombre-cliente').value.trim();
            const telefono = document.getElementById('tel-cliente').value.trim();
            const direccion = document.getElementById('dir-cliente').value.trim();

            if (!cliente || !direccion) return alert('Completa los campos obligatorios.');

            // Coordenadas simuladas inteligentes dentro de SPS o geocodificadas
            let coords = [BASE_SPS[0] + (Math.random() - 0.5) * 0.03, BASE_SPS[1] + (Math.random() - 0.5) * 0.03];

            try {
                const query = encodeURIComponent(direccion + ', San Pedro Sula, Honduras');
                const res = await fetch(`https://api.mapbox.com/geocoding/v5/mapbox.places/${query}.json?proximity=${BASE_SPS[0]},${BASE_SPS[1]}&access_token=${mapboxgl.accessToken}`);
                const data = await res.json();
                if (data.features && data.features.length > 0) {
                    coords = data.features[0].center;
                }
            } catch(e) {}

            const nuevo = {
                id: Date.now(),
                servicio,
                cliente,
                telefono,
                direccion,
                coords,
                estado: 'pendiente'
            };

            servicios.push(nuevo);
            localStorage.setItem('rutas_barralaga_operacion', JSON.stringify(servicios));

            document.getElementById('nombre-cliente').value = '';
            document.getElementById('tel-cliente').value = '';
            document.getElementById('dir-cliente').value = '';
            cerrarModal();
            renderizarOperacion();
        }

        function renderizarOperacion() {
            marcadores.forEach(m => m.remove());
            marcadores = [];

            // Pin de Base
            const elBase = document.createElement('div');
            elBase.innerHTML = '🏢';
            elBase.style.fontSize = '24px';
            marcadores.push(new mapboxgl.Marker(elBase).setLngLat(BASE_SPS).setPopup(new mapboxgl.Popup().setText('Base Rutas Barralaga')).addTo(map));

            const contenedor = document.getElementById('contenedor-lista');
            contenedor.innerHTML = '';

            servicios.forEach((item, index) => {
                const colorPin = item.estado === 'completado' ? '#16a34a' : '#111111';
                const elPin = document.createElement('div');
                elPin.innerHTML = `<div style="background:${colorPin}; color:white; border-radius:50%; width:26px; height:26px; display:flex; align-items:center; justify-content:center; font-weight:bold; font-size:11px; border:2px solid white; box-shadow:0 2px 5px rgba(0,0,0,0.3);">${index + 1}</div>`;

                const marker = new mapboxgl.Marker(elPin)
                    .setLngLat(item.coords)
                    .setPopup(new mapboxgl.Popup().setHTML(`<b>#${index + 1} - ${item.cliente}</b><br>${item.servicio}<br>${item.direccion}`))
                    .addTo(map);
                marcadores.push(marker);

                const card = document.createElement('div');
                card.className = `tarjeta-pedido ${item.estado === 'completado' ? 'completado' : ''}`;
                card.innerHTML = `
                    <div class="info-superior">
                        <span class="badge-numero">#${index + 1}</span>
                        <span class="badge-servicio">${item.servicio}</span>
                    </div>
                    <div>
                        <p class="cliente-nombre">${item.cliente} ${item.estado === 'completado' ? '✅' : ''}</p>
                        <p class="cliente-dir">📍 ${item.direccion}</p>
                    </div>
                    <div class="botones-accion">
                        <button class="btn btn-map" onclick="map.flyTo({center: [${item.coords}], zoom: 16})">🗺️ Ver</button>
                        <button class="btn btn-wa" onclick="enviarWhatsApp('${item.cliente}', '${item.direccion}', '${item.telefono}')">💬 WhatsApp</button>
                        ${item.estado === 'pendiente' ? `<button class="btn btn-ok" onclick="completar(${item.id})">✔️ Listo</button>` : ''}
                    </div>
                `;
                contenedor.appendChild(card);
            });
        }

        function completar(id) {
            const s = servicios.find(x => x.id === id);
            if (s) {
                s.estado = 'completado';
                localStorage.setItem('rutas_barralaga_operacion', JSON.stringify(servicios));
                renderizarOperacion();
            }
        }

        function enviarWhatsApp(cliente, direccion, telefono) {
            const num = telefono ? telefono.replace(/\D/g, '') : '';
            const msj = encodeURIComponent(`Hola ${cliente}, le saludamos de Rutas Barralaga 🚚. Su servicio hacia *${direccion}* está programado y en proceso.`);
            window.open(`https://wa.me/${num}?text=${msj}`, '_blank');
        }
    </script>
</body>
</html>
